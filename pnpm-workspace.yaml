packages:
  - "apps/*"
  - "packages/*"

# Build-script decisions (pnpm asks before running any postinstall, for supply-chain safety).
#   esbuild      → true:  needs its postinstall to fetch the native binary used by vite/vitest.
#   @firebase/*, protobufjs, re2 → false: Firebase toolchain native/codegen scripts pulled in by
#     @muonhub/data-provider. The provider and the emulator suite work without them; not running
#     them keeps `pnpm install` deterministic (exit 0) instead of ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  "@firebase/util": false
  protobufjs: false
  re2: false
  # sharp: Next.js image optimization (optional, unused in static export; skip to avoid native build)
  sharp: false
  # unrs-resolver: Rust-based module resolver used by tailwindcss v4 / next; must build
  unrs-resolver: true
  # es5-ext: optional compatibility helper pulled by Plotly dependencies; no native build needed
  es5-ext: false

# Single source of truth for shared tool versions (pnpm catalogs): packages reference them as
# "catalog:". TypeScript stays on 6.0 until typescript-eslint supports TypeScript 7
# (its peer range is ">=4.8.4 <6.1.0" as of 2026-10-04).
catalog:
  typescript: 6.0.3
  vitest: ^5.0.3
  "@vitest/coverage-v8": ^5.0.3
  "@types/node": ^24.19.1
  zod: ^4.6.5
